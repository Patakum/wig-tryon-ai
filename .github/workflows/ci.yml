name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - better-auth

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wig_tryon_test
          POSTGRES_USER: wig_test
          POSTGRES_PASSWORD: wig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wig_test -d wig_tryon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wig_test:wig_test@localhost:5432/wig_tryon_test
      BETTER_AUTH_SECRET: ci-only-secret-not-for-deployment
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm exec prisma db push --accept-data-loss
      - run: pnpm run build
